name: saleor production pipeline

on:
  push:
    branches:
      - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      API_URL: ${{ secrets.API_URL }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      RSA_PRIVATE_KEY: ${{ secrets.RSA_PRIVATE_KEY }}
      DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
      DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
      DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Images
        run: |
          docker compose build

      - name: Tag images for Docker Hub
        run: |
          docker tag saleor-api ${{ secrets.DOCKER_USERNAME }}/saleor-api:production
          docker tag saleor-api ${{ secrets.DOCKER_USERNAME }}/saleor-api:latest
          docker tag saleor-dashboard ${{ secrets.DOCKER_USERNAME }}/saleor-dashboard:production
          docker tag saleor-dashboard ${{ secrets.DOCKER_USERNAME }}/saleor-dashboard:latest

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push API Image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/saleor-api:production
          docker push ${{ secrets.DOCKER_USERNAME }}/saleor-api:latest

      - name: Push Dashboard Image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/saleor-dashboard:production
          docker push ${{ secrets.DOCKER_USERNAME }}/saleor-dashboard:latest


